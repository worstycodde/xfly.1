<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>Hangar – Parça Tabanlı Uçak, Roket & Drone Simülatörü</title>
<style>
  :root { --ui:#1d6feb; --ink:#16202a; --glass:rgba(255,255,255,.88); --line:rgba(22,32,42,.14);
          --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
          --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
  * { box-sizing:border-box; touch-action:none; user-select:none; -webkit-user-select:none;
      -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; width:100%; height:100%; min-height:100%; overflow:hidden; overscroll-behavior:none;
      background:#cfe0f0; color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #canvas-container { position:fixed; inset:0; width:100vw; height:100dvh; }
  canvas { display:block; }

  .panel { background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      border:1px solid var(--line); border-radius:14px; padding:6px 8px; display:flex; flex-wrap:wrap;
      gap:6px; align-items:center; box-shadow:0 4px 16px rgba(0,0,0,.08); }
  button { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px;
      padding:8px 12px; min-height:40px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
      touch-action:manipulation; pointer-events:auto; position:relative; z-index:1; }
  button:active { transform:scale(.97); }
  button.on { background:var(--ui); color:#fff; border-color:var(--ui); }
  button.danger { background:#d93829; color:#fff; border-color:#d93829; }
  button.small { padding:4px 10px; min-height:34px; }
  .hidden { display:none !important; }

  #topbar { position:fixed; z-index:30; left:calc(8px + var(--sal)); right:calc(8px + var(--sar)); top:calc(8px + var(--sat));
      display:flex; justify-content:space-between; gap:8px; pointer-events:none; flex-wrap:wrap; }
  #topbar .panel { pointer-events:auto; }

  #info { position:fixed; z-index:25; left:calc(8px + var(--sal)); top:calc(64px + var(--sat)); max-width:330px;
      font-size:12px; line-height:1.5; font-weight:600; pointer-events:none; display:block; }
  #info b.good { color:#13803a; } #info b.warn { color:#b86a00; } #info b.bad { color:#c62828; }

  #flybar { position:fixed; z-index:30; left:50%; transform:translateX(-50%); top:calc(64px + var(--sat));
      justify-content:center; max-width:calc(100vw - 16px); }
  #flybar button { padding:6px 10px; min-height:36px; font-size:12px; }

  .dock { position:fixed; z-index:30; left:calc(8px + var(--sal)); right:calc(8px + var(--sar));
      bottom:calc(8px + var(--sab)); display:flex; gap:14px; align-items:flex-start; flex-wrap:nowrap;
      max-height:42vh; overflow:auto; }
  .dock, .dock * { touch-action:pan-y; }
  .dock-col { display:flex; flex-direction:column; gap:6px; min-width:210px; flex:1 1 210px; }
  .dock-title { font-size:11px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:#425264; }
  /* iPad Safari: panel itself stays fixed; only the list is the scroll container. */
  #parts-panel { position:fixed; z-index:80; right:calc(8px + var(--sar)); top:calc(64px + var(--sat));
      bottom:calc(8px + var(--sab)); width:190px; height:auto; max-height:none; min-height:0;
      display:flex; flex-direction:column; flex-wrap:nowrap; align-items:stretch;
      overflow:hidden; overscroll-behavior:none; gap:6px; padding:9px; }
  #parts-panel, #parts-panel * { touch-action:pan-y; }
  #parts-panel { pointer-events:auto; }
  #part-buttons { pointer-events:auto; }
  #parts-panel .dock-title { flex:0 0 auto; position:relative; z-index:2; background:rgba(255,255,255,.96); padding:3px 0 6px; }
  #part-buttons { display:flex; flex:1 1 0%; min-height:0; height:0; min-width:0; flex-direction:column; gap:5px;
      overflow-y:scroll; overflow-x:hidden; -webkit-overflow-scrolling:touch;
      overscroll-behavior-y:contain; touch-action:pan-y; padding:0 3px 18px 0; }
  #part-buttons button, #part-buttons h4 { flex:0 0 auto; }
  #part-buttons h4 { flex:0 0 auto; margin:8px 0 2px; font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#6b7a8c; }
  #part-buttons button { display:flex; flex:0 0 auto; align-items:center; gap:8px; width:100%; text-align:left; padding:7px 8px; min-height:40px; font-size:12px; }
  #part-buttons i { flex:none; width:14px; height:14px; border-radius:50%; border:1px solid rgba(0,0,0,.25); }\n  #part-buttons::-webkit-scrollbar { width:5px; }\n  #part-buttons::-webkit-scrollbar-thumb { background:rgba(60,80,105,.38); border-radius:8px; }
  #build-dock { right:calc(206px + var(--sar)); flex-direction:column; align-items:stretch; gap:4px; max-height:36dvh; padding:6px 8px; overflow:hidden; }
  #build-dock.collapsed { right:auto; }
  #dock-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  #dock-body { display:flex; gap:12px; overflow:auto; align-items:flex-start; }
  #build-dock.collapsed #dock-body { display:none; }
  #build-dock button { min-height:32px; padding:4px 9px; font-size:12px; }
  #build-dock .dock-col { min-width:150px; flex:1 1 150px; gap:4px; }
  .wrap { display:flex; flex-wrap:wrap; gap:6px; }
  .move-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .move-grid button { padding:6px 4px; }

  /* Uçuş ekranı: görüş alanının ortası tamamen boş bırakılır. */
  #hud { position:fixed; z-index:25; left:0; right:0; bottom:calc(8px + var(--sab));
      display:flex; justify-content:space-between; align-items:flex-end;
      padding:0 calc(10px + var(--sar)) 0 calc(10px + var(--sal)); pointer-events:none; }
  #sticks-wrap { display:flex; justify-content:space-between; width:100%; pointer-events:none; align-items:flex-end; }
  #telemetry { position:fixed; z-index:24; top:calc(58px + var(--sat)); right:calc(10px + var(--sar));
      display:block; padding:5px 8px; min-width:0; border:0; border-radius:8px;
      background:rgba(12,20,30,.24); color:#fff; text-shadow:0 1px 3px #17202b;
      font-size:10px; font-weight:700; line-height:1.45; white-space:pre;
      font-variant-numeric:tabular-nums; pointer-events:none; box-shadow:none; }
  .stick { position:relative; width:112px; height:112px; border-radius:50%; pointer-events:auto;
      background:rgba(15,25,38,.08); border:1px solid rgba(255,255,255,.25);
      box-shadow:none; opacity:.24; transition:opacity .15s, background .15s; }
  .stick:active { opacity:.92; background:rgba(15,25,38,.35); }
  .stick::before, .stick::after { content:""; position:absolute; background:rgba(255,255,255,.22); }
  .stick::before { left:50%; top:10px; bottom:10px; width:1px; margin-left:-.5px; }
  .stick::after  { top:50%; left:10px; right:10px; height:1px; margin-top:-.5px; }
  .stick .lab { position:absolute; left:0; right:0; bottom:-15px; text-align:center; font-size:9px; font-weight:700; color:rgba(255,255,255,.72); text-shadow:0 1px 3px #17202b; }
  .knob { position:absolute; width:42px; height:42px; left:calc(50% - 21px); top:calc(50% - 21px); border-radius:50%;
      background:rgba(65,145,255,.34); border:1px solid rgba(255,255,255,.35); box-shadow:none; }
  body.flight-mode #topbar > .panel:last-child { display:none; }
  body.flight-mode #flybar { left:auto; right:calc(8px + var(--sar)); top:calc(8px + var(--sat)); transform:none;
      max-width:min(66vw, 560px); padding:4px; background:rgba(12,20,30,.28); border-color:rgba(255,255,255,.12); box-shadow:none; }
  body.flight-mode #flybar button { min-height:30px; padding:4px 7px; font-size:10px; background:rgba(255,255,255,.78); }
  body.flight-mode #flybar button.on { background:rgba(29,111,235,.85); color:#fff; }
  @media (max-width:900px) {
    #parts-panel { width:clamp(180px, 23vw, 220px); top:calc(62px + var(--sat)); bottom:calc(8px + var(--sab)); }
    #build-dock { right:calc(clamp(186px, 24vw, 221px) + var(--sar)); max-height:38dvh; }
  }
  @media (max-height:820px) and (min-width:701px) {
    #parts-panel { top:calc(58px + var(--sat)); bottom:calc(7px + var(--sab)); }
    #build-dock { max-height:40dvh; }
  }
  @media (max-width:700px) {
    #parts-panel { width:clamp(168px, 34vw, 205px); top:calc(58px + var(--sat)); bottom:calc(8px + var(--sab)); }
    #build-dock { right:calc(174px + var(--sar)); max-height:36dvh; }
    .stick { width:86px; height:86px; opacity:.18; }
    .knob { width:34px; height:34px; left:calc(50% - 17px); top:calc(50% - 17px); }
    .stick .lab { font-size:8px; bottom:-13px; }
    body.flight-mode #flybar { max-width:calc(100vw - 105px); }
    body.flight-mode #flybar button { min-height:27px; padding:3px 5px; font-size:9px; }
    #telemetry { font-size:9px; top:calc(54px + var(--sat)); }
  }

  #overlay { position:fixed; z-index:40; left:50%; top:42%; transform:translate(-50%,-50%); text-align:center;
      padding:14px 22px; font-size:15px; font-weight:800; }
  #toast { position:fixed; z-index:60; left:50%; bottom:calc(46vh + var(--sab)); transform:translateX(-50%);
      background:rgba(22,32,42,.92); color:#fff; padding:8px 14px; border-radius:10px; font-size:13px;
      font-weight:600; pointer-events:none; opacity:0; transition:opacity .25s; max-width:90vw; text-align:center; }
  #toast.show { opacity:1; }
  #stall { position:fixed; z-index:35; left:50%; top:calc(110px + var(--sat)); transform:translateX(-50%);
      background:#d93829; color:#fff; font-weight:800; padding:4px 14px; border-radius:8px; font-size:13px; }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="topbar">
  <div class="panel">
    <strong style="font-size:13px">Hangar</strong>
    <button id="btn-build" class="on">🛠 İnşa</button>
    <button id="btn-fly">✈️ Uçuş</button>
  </div>
  <div class="panel">
    <button id="btn-zoom-in" class="small">＋</button>
    <button id="btn-zoom-out" class="small">－</button>
  </div>
</div>

<div id="info" class="panel"></div>

<div id="flybar" class="panel hidden">
  <button id="btn-cam">📷 Pilot</button>
  <button id="btn-assist" class="on">Asistan</button>
  <button id="btn-acro" class="hidden">ANGLE</button>
  <button id="btn-althold" class="hidden on">İrtifa Tut</button>
  <button id="btn-pinv">Pitch Ters</button>
  <button id="btn-wind">🌬 Rüzgâr: Yok</button>
  <button id="btn-sound">🔊</button>
  <button id="btn-brake">Fren</button>
  <button id="btn-resetfly" class="danger">↺ Sıfırla</button>
</div>

<div id="stall" class="hidden">STALL – burnu indir!</div>
<div id="overlay" class="panel hidden"></div>
<div id="toast"></div>

<div id="parts-panel" class="panel"><div class="dock-title">Parçalar</div><div id="part-buttons"></div></div>

<div id="build-dock" class="dock panel">
  <div id="dock-head"><span class="dock-title" id="sel-title">Seçili parça: —</span><button id="dock-toggle" class="small">▾ Gizle</button></div>
  <div id="dock-body">
    <div class="dock-col">
      <div class="dock-title">Model</div>
      <div class="wrap">
        <button data-preset="plane">Uçak</button><button data-preset="quad">Quad</button><button data-preset="empty">Boş</button>
        <button id="btn-save">💾</button><button id="btn-load">📂</button>
      </div>
      <div class="dock-title">Hareket adımı</div>
      <div class="wrap"><button data-step="0.02" class="small">2 cm</button><button data-step="0.05" class="small">5 cm</button><button data-step="0.1" class="small on">10 cm</button><button data-step="0.25" class="small">25 cm</button></div>
    </div>
    <div class="dock-col">
      <div class="dock-title">Konum</div>
      <div class="move-grid">
        <button data-mv="x-">← Sol</button><button data-mv="x+">Sağ →</button>
        <button data-mv="y+">↑ Yukarı</button><button data-mv="y-">↓ Aşağı</button>
        <button data-mv="z-">▲ Burun</button><button data-mv="z+">▼ Kuyruk</button>
      </div>
    </div>
    <div class="dock-col">
      <div class="dock-title">Düzenle</div>
      <div class="wrap">
        <button data-rot="x">⟳X</button><button data-rot="y">⟳Y</button><button data-rot="z">⟳Z</button>
        <button id="btn-size-" class="small">Boyut −</button><button id="btn-size+" class="small">Boyut ＋</button>
        <button id="btn-mirror">⇋ Aynala</button><button id="btn-dup">⧉ Çoğalt</button>
      </div>
      <div class="dock-title">Araçlar</div>
      <div class="wrap">
        <button id="btn-undo">↶ Geri al</button><button id="btn-center">⊕ Ortala</button><button id="btn-match">◎ Çapı eşle</button>
        <button id="btn-snap" class="on">🧲 Yapış</button><button id="btn-delete" class="danger">🗑 Sil</button>
      </div>
    </div>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="sticks-wrap">
    <div class="stick" id="stick-left"><div class="knob" id="knob-left"></div><div class="lab">GAZ · YAW</div></div>
    <div class="stick" id="stick-right"><div class="knob" id="knob-right"></div><div class="lab">PITCH · ROLL</div></div>
  </div>
</div>
<div id="telemetry" class="hidden"></div>


<script>
(function loadThree(index) {
  const sources = [
    'https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js',
    'https://unpkg.com/three@0.149.0/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/149/three.min.js',
    'https://threejs.org/build/three.min.js'
  ];
  if (index >= sources.length) {
    showBootError(new Error('Three.js hiçbir kaynaktan yüklenemedi. İnternet bağlantısını kontrol edip yeniden dene.'));
    return;
  }
  const script = document.createElement('script');
  script.src = sources[index];
  script.onload = function () {
    try { startHangar(); }
    catch (err) { showBootError(err); }
  };
  script.onerror = function () { loadThree(index + 1); };
  document.head.appendChild(script);
})();
function showBootError(err) {
  let box = document.getElementById('boot-error');
  if (!box) {
    box = document.createElement('div');
    box.id = 'boot-error';
    box.style.cssText = 'position:fixed;z-index:99999;inset:12px;display:grid;place-content:center;gap:12px;padding:22px;background:rgba(12,20,30,.96);color:white;border:1px solid #718096;border-radius:16px;text-align:center;font:600 15px/1.5 system-ui;white-space:pre-wrap';
    document.body.appendChild(box);
  }
  const msg = String(err && (err.stack || err.message) || err).slice(0, 1800);
  box.innerHTML = '';
  const title = document.createElement('strong'); title.textContent = 'Hangar başlatılamadı';
  const detail = document.createElement('div'); detail.textContent = msg;
  const retry = document.createElement('button'); retry.textContent = '↻ Yeniden dene';
  retry.style.cssText = 'padding:12px 18px;background:#1d6feb;color:white;border:0;border-radius:10px;font:700 15px system-ui';
  retry.onclick = () => { box.remove(); loadThree(0); };
  box.append(title, detail, retry);
}
window.addEventListener('error', e => {
  const msg = e && e.message ? e.message : 'Bilinmeyen çalışma hatası';
  let bar = document.getElementById('runtime-error');
  if (!bar) {
    bar = document.createElement('div'); bar.id = 'runtime-error';
    bar.style.cssText = 'position:fixed;z-index:99998;left:8px;right:8px;top:8px;padding:9px 12px;border-radius:10px;background:#9f241d;color:white;font:600 12px/1.4 system-ui;white-space:pre-wrap';
    document.body.appendChild(bar);
  }
  bar.textContent = 'Çalışma hatası: ' + msg;
});
function startHangar() {

const THREE = window.THREE;
if (!THREE) { document.getElementById('canvas-container').innerHTML = '<div style="position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;font:600 16px system-ui;color:#243449">3D kütüphanesi yüklenemedi. İnternet bağlantısını kontrol edip yeniden aç.</div>'; throw new Error('Three.js yüklenemedi'); }

// ==== PHYSICS CORE BEGIN ====
// Eksen düzeni (gövde ve dünya): +X sağ, +Y yukarı, burun = -Z, kuyruk = +Z
const G = 9.81, RHO = 1.225;
const STALL_AOA = 0.30;               // rad (~17°)
const K_ELEV = 0.25, K_AIL = 0.12, K_RUD = 0.25;   // kontrol yüzeyi sapma (rad)
const K_YAWREACT = 0.05;              // rotor reaksiyon torku katsayısı (m)

const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const vadd = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];
const vsub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const vmul = (a, s) => [a[0]*s, a[1]*s, a[2]*s];
const vdot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const vcross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const vlen = a => Math.sqrt(vdot(a, a));
const vnorm = a => { const l = vlen(a) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };
const qmul = (a, b) => [
  a[3]*b[0] + a[0]*b[3] + a[1]*b[2] - a[2]*b[1],
  a[3]*b[1] - a[0]*b[2] + a[1]*b[3] + a[2]*b[0],
  a[3]*b[2] + a[0]*b[1] - a[1]*b[0] + a[2]*b[3],
  a[3]*b[3] - a[0]*b[0] - a[1]*b[1] - a[2]*b[2]];
const qrot = (q, v) => { const u = [q[0], q[1], q[2]]; const t = vmul(vcross(u, v), 2);
  return vadd(vadd(v, vmul(t, q[3])), vcross(u, t)); };
const qinv = q => [-q[0], -q[1], -q[2], q[3]];
const qrotInv = (q, v) => qrot(qinv(q), v);
const qaxis = (ax, ang) => { const s = Math.sin(ang/2), n = vnorm(ax); return [n[0]*s, n[1]*s, n[2]*s, Math.cos(ang/2)]; };
const qnorm = q => { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0]/l, q[1]/l, q[2]/l, q[3]/l]; };
const smooth01 = (x, a, b) => { const t = clamp((x-a)/(b-a), 0, 1); return t*t*(3-2*t); };

// Parça kataloğu: dims = [x genişlik, y yükseklik, z uzunluk] (metre), mass = kg
const PART_DEFS = {
  fuselage:   { k:'fus', label:'Gövde',          dims:[0.36,0.36,1.4], mass:1.3, color:0xf2f4f7, sh:'fus' },
  slim:       { k:'fus', label:'İnce Gövde',     dims:[0.2,0.22,1.6],  mass:0.6, color:0xe5e7eb, sh:'slim' },
  tailcone:   { k:'fus', label:'Kuyruk Konisi',  dims:[0.36,0.36,0.7], mass:0.3, color:0xf2f4f7, sh:'tailcone' },
  nose:       { k:'fus', label:'Burun Konisi',   dims:[0.34,0.34,0.5], mass:0.25,color:0xdc2626, sh:'nose' },
  tank:       { k:'fus', label:'Yakıt Tankı',    dims:[0.4,0.4,0.9],   mass:1.0, color:0xf8fafc, sh:'tank' },
  pod:        { k:'fus', label:'Kapsül',         dims:[0.5,0.45,0.7],  mass:0.8, color:0xcbd5e1, sh:'pod' },
  cockpit:    { k:'fus', label:'Kokpit Kanopi',  dims:[0.3,0.25,0.6],  mass:0.2, color:0x7dd3fc, sh:'canopy' },
  battery:    { k:'fus', label:'Batarya',        dims:[0.14,0.1,0.32], mass:0.5, color:0xfacc15, sh:'pill' },
  camera:     { k:'fus', label:'Kamera Küresi',  dims:[0.12,0.12,0.12],mass:0.12,color:0x111827, sh:'ball' },
  wing:       { k:'wing', label:'Kanat',         dims:[3.0,0.05,0.45], mass:1.2, color:0xf57c00, taper:0.65, sw:0.3 },
  rect:       { k:'wing', label:'Düz Kanat',     dims:[2.4,0.06,0.5],  mass:1.0, color:0xfbbf24, taper:1,    sw:0 },
  swept:      { k:'wing', label:'Ok Kanat',      dims:[2.2,0.045,0.6], mass:0.9, color:0x94a3b8, taper:0.35, sw:0.9, af:0.8 },
  delta:      { k:'wing', label:'Delta Kanat',   dims:[1.6,0.05,0.9],  mass:0.9, color:0xef4444, taper:0.04, sw:0.96,af:0.55 },

const WHEEL_R = 0.09;
const ROUND = new Set(['fuselage','slim','tank','nose','tailcone']);   // dairesel kesitli, birbirine çap eşitlenen gövdeler
function partDims(p) { const def = PART_DEFS[p.type], s = p.scale || 1, d = def.dims.map(v => v*s);
  if (p.w) { d[1] = p.w*def.dims[1]/def.dims[0]; d[0] = p.w; } return d; }

function rotDims(q, d) {
  const ax = [qrot(q,[1,0,0]), qrot(q,[0,1,0]), qrot(q,[0,0,1])];
  return [0,1,2].map(i => Math.abs(ax[0][i])*d[0] + Math.abs(ax[1][i])*d[1] + Math.abs(ax[2][i])*d[2]);
}

// Parça listesinden fiziksel model çıkarır (kütle, CG, atalet, yüzeyler, motorlar, temas noktaları)
function analyzeCraft(parts) {
  const C = { type:'none', mass:0, com:[0,0,0], I:[1,1,1], surfaces:[], motors:[], contacts:[], cda:[0,0,0],
    nose:[0,0.05,-1], margin:null, np:null, cbar:0.3, wingArea:0, wingSpan:0, stallSpeed:null, tw:0,
    nWheels:0, motorIndexByPart:{}, rotorIdx:[], rotorTmax:0, Sz2:0, Sx2:0, dih:0, hasWing:false };
  if (!parts.length) return C;

  let M = 0, c = [0,0,0]; const ms = [];
  for (const p of parts) { const d = PART_DEFS[p.type], s = p.scale || 1, m = d.mass*s*s*(p.w ? (p.w/(d.dims[0]*s))**2 : 1);
    ms.push(m); M += m; c = vadd(c, vmul(p.pos, m)); }
  c = vmul(c, 1/M); C.mass = M; C.com = c;

  let Ix = 0, Iy = 0, Iz = 0;
  const surfaces = [];
  const addSurf = (kind, center, n, cdir, S, AR) => {
    const a = 2*Math.PI*AR/(AR+2);
    surfaces.push({ kind, r: vsub(center, c), n, c: cdir, S, AR, a, cd0: 0.02, ail:0, elev:0, rud:0, wash:false, washDir:[0,0,-1] });
  };

  parts.forEach((p, i) => {
    const def = PART_DEFS[p.type], s = p.scale || 1, m = ms[i];
    const d = partDims(p), db = rotDims(p.q, d);
    const r = vsub(p.pos, c);
    Ix += m*(r[1]*r[1] + r[2]*r[2] + (db[1]*db[1] + db[2]*db[2])/12);
    Iy += m*(r[0]*r[0] + r[2]*r[2] + (db[0]*db[0] + db[2]*db[2])/12);
    Iz += m*(r[0]*r[0] + r[1]*r[1] + (db[0]*db[0] + db[1]*db[1])/12);

    const fwd = qrot(p.q, [0,0,-1]);
    if (def.k === 'wing' || def.k === 'tail') {
      const span = d[0], chord = d[2], S = span*chord*(def.af||1), AR = span/chord/(def.af||1);
      const n = qrot(p.q, [0,1,0]), sp = qrot(p.q, [1,0,0]);
      for (const sg of [-1, 1]) {
        const ctr = vadd(vadd(p.pos, vmul(sp, sg*span/4)), vmul(fwd, chord*0.25));
        addSurf(def.k, ctr, n, fwd, S/2, AR);
      }
      if (def.k === 'wing') { C.wingArea += S; C.wingSpan += span; C.hasWing = true; }
    } else if (def.k === 'fin') {
      const span = d[1], chord = d[2];
      const n = qrot(p.q, [1,0,0]);
      addSurf('fin', vadd(p.pos, vmul(fwd, chord*0.25)), n, fwd, span*chord, Math.max(0.8, span/chord));
    } else {
      // gövde benzeri parçaların gövde sürüklemesi
      const cdAxial = def.k === 'fus' ? 0.25 : 0.6, cdCross = def.k === 'fus' ? 0.8 : 0.9;
      C.cda[0] += db[1]*db[2]*cdCross;
      C.cda[1] += db[0]*db[2]*cdCross;
      C.cda[2] += db[0]*db[1]*cdAxial;
    }

    if (def.k === 'prop' || def.k === 'rotor') {
      const dir = def.k === 'rotor' ? qrot(p.q, [0,1,0]) : qrot(p.q, [0,0,-1]);
      const mo = { partId:p.id, kind: def.k, engineShape:def.sh || '', r, dir, Tmax: def.thrust*s*s, tau: def.tau, spin:0 };
      C.motorIndexByPart[p.id] = C.motors.length;
      C.motors.push(mo);
    }

    // temas noktaları
    if (def.k === 'gear') {
      const h = d[1];
      const cr = vsub(vadd(p.pos, qrot(p.q, [0,-h,0])), c);
      C.contacts.push({ r: cr, radius: WHEEL_R*s, kind:'wheel', steer:false, k:0, cd:0 });
    } else {
      for (const sx of [-1,1]) for (const sy of [-1,1]) for (const sz of [-1,1]) {
        const cr = vsub(vadd(p.pos, qrot(p.q, [sx*d[0]/2, sy*d[1]/2, sz*d[2]/2])), c);
        C.contacts.push({ r: cr, radius: 0.015, kind:'hit', steer:false, k:0, cd:0 });
        const fz = -cr[2];
        if (fz > -C.nose[2] - 1e-6 || C.nose[2] === -1 && fz > 1) C.nose = [0, 0.05, cr[2]];
      }
    }
  });
  C.I = [Math.max(0.02, Ix), Math.max(0.02, Iy), Math.max(0.02, Iz)];

  // Kontrol yüzeyi atamaları
  const hasTail = surfaces.some(s => s.kind === 'tail');
  for (const s of surfaces) {
    const ny = s.n[1], nx = s.n[0];
    if (s.kind === 'wing') {
      if (Math.abs(ny) > 0.7 && Math.abs(s.r[0]) > 0.15) s.ail = -Math.sign(s.r[0]) * Math.sign(ny);
      if (!hasTail && Math.abs(ny) > 0.7 && s.r[2] > 0.15) s.elev = -Math.sign(ny);   // uçan kanat: elevon
    } else {
      if (Math.abs(ny) > 0.7) s.elev = -Math.sign(ny);
      if (Math.abs(nx) > 0.7) s.rud = -Math.sign(nx);
    }
  }
  C.surfaces = surfaces;

  // Pervane akışı (slipstream) alan yüzeyler
  for (const mo of C.motors) {
    if (mo.kind !== 'prop') continue;
    for (const s of surfaces) {
      const rel = vsub(s.r, mo.r), along = vdot(rel, mo.dir);
      const perp = vlen(vsub(rel, vmul(mo.dir, along)));
      if (along < -0.3 && perp < 1.2) { s.wash = true; s.washDir = mo.dir; }
    }
  }

  // Temas yay/sönüm sabitleri
  const wheels = C.contacts.filter(k => k.kind === 'wheel'), hits = C.contacts.filter(k => k.kind === 'hit');
  C.nWheels = wheels.length;
  for (const w of wheels) { w.k = M*G/(wheels.length*0.045); w.cd = 0.5*2*Math.sqrt(w.k*M/wheels.length); }
  for (const h of hits)   { h.k = M*1500/hits.length*2.0; h.cd = 1.2*2*Math.sqrt(h.k*M/hits.length)*0.5; }
  if (wheels.length) {
    let zmax = 0; for (const w of wheels) zmax = Math.max(zmax, Math.abs(w.r[2]));

function attitude(q) {

function computeControls(b, craft, inp, dt) {

  if (b.crashed) return out;
  const thr = clamp(inp.throttle, 0, 1);
  const att = attitude(b.q);

      const err = [db[2], 0, -db[0]];
      wdes = [clamp(6*err[0], -5, 5), -inp.yaw*2.5, clamp(6*err[2], -5, 5)];
    }
    const KR = 22;
    const tau = [craft.I[0]*KR*(wdes[0]-b.w[0]), craft.I[1]*KR*(wdes[1]-b.w[1]), craft.I[2]*KR*(wdes[2]-b.w[2])];

      const vzd = st * (st > 0 ? 4 : 3);
      Tc = craft.mass*(G + clamp(4.0*(vzd - b.v[1]), -8, 10)) / Math.max(0.5, up[1]);
    } else Tc = thr * craft.rotorTmax;
    Tc = clamp(Tc, 0, craft.rotorTmax*0.97);

      if (craft.Sz2 > 1e-6) T += -m.r[2]*tau[0]/craft.Sz2;
      if (craft.Sx2 > 1e-6) T +=  m.r[0]*tau[2]/craft.Sx2;

function stepBody(b, craft, inp, env, dt) {

    const vn = vdot(vl, s.n), vc = vdot(vl, s.c);

    const aoa = Math.atan2(-vn, vcp) + delta;
    const aa = Math.abs(aoa);
    const clLin = s.a*aoa, cdLin = s.cd0 + clLin*clLin/(Math.PI*0.8*s.AR) + 0.04*Math.abs(delta);

    const CL = (1 - sig)*clLin + sig*clPost, CD = (1 - sig)*cdLin + sig*cdPost;
    if (s.kind === 'wing' && Math.abs(s.n[1]) > 0.7) maxAoaWing = Math.max(maxAoaWing, aa);
    const q = 0.5*RHO*V2*s.S;
    const cc = vmul(s.c, sg);
    const l = vmul(vadd(vmul(cc, -vn), vmul(s.n, vcp)), 1/V);
    const d = vmul(vadd(vmul(cc, vcp), vmul(s.n, vn)), 1/V);

    let T = m.Tmax * b.motor[i];
    if (m.kind === 'prop') {

    const c = craft.contacts[i];

    if (!b.contactState[i]) {
      b.contactState[i] = true;

      const hs = Math.hypot(vw[0], vw[2]);

      Fh = [vw[0]*sc, vw[2]*sc];
    }
    const Fc = [Fh[0], N, Fh[1]];
    Fw = vadd(Fw, Fc);

  b.t += dt;
}

function makeStick(el, knob, cfg, onChange) {

  el.addEventListener('pointermove', e => { if (e.pointerId === id) { fromPointer(e); e.preventDefault(); } });
  const end = e => { if (e.pointerId !== id) return; id = null; setKnob(0, cfg.springY ? 0 : ny); onChange(nx, ny); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);

});

canvasEl.addEventListener('pointerup', endPtr); canvasEl.addEventListener('pointercancel', endPtr);
canvasEl.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoomValue()*(e.deltaY > 0 ? 1.1 : 0.9)); }, { passive:false });
function zoomValue() { return state.mode === 'build' ? state.camDist : state.camMode === 'chase' ? state.chaseDist : 1/state.pilotZoom; }
function setZoom(v) {

  else if (state.camMode === 'pilot') state.pilotZoom = clamp(1/v, 0.4, 3);
}
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => {
  const t = e.target;

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
let drag = null; const dragPt = new THREE.Vector3(), dragV = new THREE.Vector3();
const partHalf = p => rotDims(p.q, partDims(p)).map(v => v/2);
// Gövde merkezi: iniş takımında bacak aşağı uzandığı için kutu merkezi kaydırılır
const partCtr = p => { if (PART_DEFS[p.type].k !== 'gear') return p.pos; const o = qrot(p.q, [0, -PART_DEFS.gear.dims[1]*(p.scale || 1)/2, 0]); return vadd(p.pos, o); };
function snapPos(p, pos) {
  if (!state.opts.snap) return pos.slice();
  const hd = partHalf(p), cOff = vsub(partCtr(p), p.pos), c = vadd(pos, cOff), TH = 0.16, out = pos.slice(), best = [TH, TH, TH];
  for (const o of state.parts) {
    if (o === p) continue;
    const ho = partHalf(o), co = partCtr(o);
    if (![0,1,2].every(i => Math.abs(c[i] - co[i]) <= ho[i] + hd[i] + TH)) continue;   // yalnız yakındaki parçalara yapış
    const bodies = PART_DEFS[o.type].k === 'fus' && PART_DEFS[p.type].k === 'fus', emb = bodies ? 0 : 0.02;
    for (let i = 0; i < 3; i++) {
      for (const t of [co[i], co[i] + ho[i] + hd[i] - emb, co[i] - ho[i] - hd[i] + emb]) {

}
function startDrag(e) {
  ndc.set(e.clientX/innerWidth*2 - 1, -(e.clientY/innerHeight)*2 + 1); raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(craftModel.children.filter(c => c.userData.partId), true)[0];
  drag = null; if (!hit) return;
  let o = hit.object; while (o && !(o.userData && o.userData.partId)) o = o.parent; if (!o) return;
  const part = state.parts.find(q => q.id === o.userData.partId); if (!part) return;
  state.selectedId = part.id; applyHighlight(); updateSelTitle();
  craftModel.updateWorldMatrix(true, false);
  const loc = craftModel.worldToLocal(hit.point.clone());

}
function doDrag(e) {

    if (Math.abs(p.pos[0] - o.pos[0]) < .05 && Math.abs(p.pos[1] - o.pos[1]) < .05 && Math.abs(Math.abs(p.pos[2] - o.pos[2]) - (hp[2] + ho[2])) < .03) {

function finishDrag() { if (drag && drag.changed) { const part = state.parts.find(q => q.id === drag.id); if (part) { matchDiameter(part); part.pos[0] = Math.round(part.pos[0]*1000)/1000; } refresh(); } drag = null; }

  ndc.set(x/innerWidth*2 - 1, -(y/innerHeight)*2 + 1);

  let id = null;
  if (hits.length) { let o = hits[0].object; while (o && !(o.userData && o.userData.partId)) o = o.parent; if (o) id = o.userData.partId; }

const chaseFwd = new THREE.Vector3(0, 0, -1), camPos = new THREE.Vector3(), camTarget = new THREE.Vector3(), tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion();
const tiltQ = new THREE.Quaternion();
function cycleCamera() {
  state.camMode = state.camMode === 'pilot' ? 'chase' : state.camMode === 'chase' ? 'fpv' : 'pilot';
  $('btn-cam').textContent = '📷 ' + { pilot:'Pilot', chase:'Takip', fpv:'FPV' }[state.camMode];
  chaseFwd.set(0, 0, -1);
}
function setFov(f) { if (Math.abs(camera.fov - f) > 0.05) { camera.fov = f; camera.updateProjectionMatrix(); } }
function updateCamera(dt) {
  if (state.mode === 'build') {
    const t = tmpV.copy(craftGroup.position).add(new THREE.Vector3(0, 0.3, 0));
    const cp = Math.cos(state.camPitch);
    camera.position.set(t.x + state.camDist*cp*Math.sin(state.camYaw), t.y + state.camDist*Math.sin(state.camPitch), t.z + state.camDist*cp*Math.cos(state.camYaw));
    camera.lookAt(t); setFov(60); return;
  }
  const b = state.body; if (!b) return;
  const P = craftGroup.position;
  if (state.camMode === 'chase') {
    setFov(62);
    const f = qrot(b.q, [0, 0, -1]); tmpV.set(f[0], f[1]*0.5, f[2]).normalize();

    camPos.y = Math.max(0.5, camPos.y);

  } else if (state.camMode === 'fpv') {

    const off = qrot(b.q, [0, 0.06, n[2] - 0.12]);
    camera.position.set(b.p[0] + off[0], b.p[1] + off[1], b.p[2] + off[2]);

const envState = { wind:[0, 0, 0] };
function windAt(t) {
  const sp = WIND_LEVELS[state.opts.wind]; if (!sp) return [0, 0, 0];
  const g = 1 + 0.25*Math.sin(t*0.9) + 0.15*Math.sin(t*2.3 + 1.0);
  const d = vnorm([-0.6, 0, 0.8]);

}
function syncCraft(dt) {
  const b = state.body, C = state.craft; if (!b) return;
  craftModel.position.set(-C.com[0], -C.com[1], -C.com[2]);
  craftGroup.position.set(b.p[0], b.p[1], b.p[2]);
  craftGroup.quaternion.set(b.q[0], b.q[1], b.q[2], b.q[3]);
  for (const g of craftModel.children) {
    const mi = C.motorIndexByPart[g.userData.partId]; const th = mi !== undefined ? b.motor[mi] : 0;
    const fl = g.userData && g.userData.flame;
    if (fl) {
      const t = performance.now()/1000, on = th > 0.03 && !b.crashed; fl.root.visible = on;
      if (on) { const f = 1 + .07*Math.sin(t*55 + fl.ph) + .05*Math.sin(t*131 + fl.ph*2) + (Math.random()-.5)*.06, a = Math.min(1, th*1.5);

}
function resetFlight() {
  startFlight(); syncCraft(0);
}

// Minimal uçuş telemetrisi (görüş merkezinin dışında)
const teleEl = $('telemetry'); let teleT = 0;
function updateHud(dt) {
  const b = state.body, C = state.craft; if (!b) return;
  const att = attitude(b.q);
  teleT += dt; if (teleT < 0.1) return; teleT = 0;
  const gs = Math.hypot(b.v[0], b.v[2]);

    `Hava hz ${b.airspeed.toFixed(1).padStart(5)} m/s (${(b.airspeed*3.6).toFixed(0)} km/h)   Yer ${gs.toFixed(1)}\n` +
    `Gaz ${Math.round(state.rc.throttle*100).toString().padStart(3)}%  Motor ${thr}%   Yön ${hdg.toFixed(0).padStart(3)}°`;
  $('stall').classList.toggle('hidden', !(b.stalled && !b.onGround && C.type === 'plane' && !b.crashed));
  if (b.crashed) showOverlay(`💥 Kaza! <span style="font-weight:600">${b.crashReason}</span><br><button class="danger" style="margin-top:8px" id="ov-reset">↺ Yeniden başlat</button>`);
}
document.addEventListener('click', e => { if (e.target && e.target.id === 'ov-reset') resetFlight(); });

// Ses
let audio = null;
function initAudio() {
  if (!state.opts.sound) return;
  if (audio) { try { if (audio.ctx.state === 'suspended') audio.ctx.resume(); } catch (_) {} return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = new AC(), o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 1100; g.gain.value = 0;
    o.connect(f); f.connect(g); g.connect(ctx.destination); o.start(); audio = { ctx, o, g };
  } catch (_) {}
}
function updateAudio() {
  if (!audio) return;
  const on = state.opts.sound && state.mode === 'fly' && state.body && !state.body.crashed;
  let th = 0; if (on) th = state.body.motor.length ? Math.max(...state.body.motor) : 0;
  const multi = state.craft.type === 'multirotor';
  const base = multi ? 140 : 55, span = multi ? 260 : 170;
  audio.o.frequency.setTargetAtTime(base + th*span + (on ? Math.min(40, state.body.airspeed) : 0), audio.ctx.currentTime, 0.06);

{

document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { loadPreset(b.dataset.preset); if (b.dataset.preset !== 'empty') toast('Model yüklendi'); });

  state.step = parseFloat(b.dataset.step); document.querySelectorAll('[data-step]').forEach(x => x.classList.toggle('on', x === b)); });

$('btn-mirror').onclick = mirrorPart; $('btn-dup').onclick = dupPart; $('btn-delete').onclick = deletePart;
$('btn-save').onclick = saveDesign; $('btn-load').onclick = loadDesign;

$('btn-zoom-in').onclick = () => setZoom(zoomValue()*0.8); $('btn-zoom-out').onclick = () => setZoom(zoomValue()*1.25);

$('btn-pinv').onclick = e => { state.opts.invertPitch = !state.opts.invertPitch; e.currentTarget.classList.toggle('on', state.opts.invertPitch); toast(state.opts.invertPitch ? 'İtince burun yukarı' : 'Geri çekince burun yukarı'); };
$('btn-acro').onclick = e => { state.opts.acro = !state.opts.acro; e.currentTarget.textContent = state.opts.acro ? 'ACRO' : 'ANGLE'; e.currentTarget.classList.toggle('on', state.opts.acro); };

{

function onResize() {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
}

// ---------------------------------------------------------------------
//  Ana döngü (sabit adımlı fizik)
// ---------------------------------------------------------------------
const STEP = 1/120; let acc = 0, simT = 0, last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - last)/1000); last = now;
  pollGamepad(dt);
  if (state.mode === 'fly' && state.body && state.craft.type !== 'none') {
    const inp = buildInput(dt);
    envState.wind = windAt(simT);
    acc += dt; let n = 0;
    while (acc >= STEP && n < 10) { stepBody(state.body, state.craft, inp, envState, STEP); acc -= STEP; simT += STEP; n++; }
    if (n === 10) acc = 0;
    syncCraft(dt); updateHud(dt);
  }
  // rüzgâr gülü
  { const w = envState.wind, sp = Math.hypot(w[0], w[2]), u = sockGroup.userData;
    if (sp > 0.05) u.head.rotation.y += (Math.atan2(w[0], w[2]) - u.head.rotation.y) * 0.1;
    u.cone.rotation.x = Math.PI/2 + Math.max(0, 1 - sp/8)*0.9; if (!sp) u.cone.rotation.x = Math.PI/2 + 0.9; }
  updateCamera(dt);
  const tp = craftGroup.position;
  // İrtifayla atmosferden uzaya yumuşak geçiş
  const altitude=Math.max(0,tp.y);
  const spaceBlend=clamp((altitude-1800)/1500,0,1);
  skyDome.visible=spaceBlend<0.98;
  scene.background=spaceBlend>0.02 ? new THREE.Color(0x02040d).lerp(new THREE.Color(0x000008),spaceBlend) : null;
  if (window.__skySpace) {
    const sp=window.__skySpace;
    sp.starMat.opacity=spaceBlend;
    sp.stars.position.copy(camera.position);
    sp.planet.visible=spaceBlend>0.25;
    sp.moon.visible=spaceBlend>0.45;
    sp.planet.position.copy(camera.position).add(new THREE.Vector3(-5200,2200,-7200));
    sp.moon.position.copy(camera.position).add(new THREE.Vector3(3900,2900,-7600));
    for (const cl of sp.cloudLayers) cl.visible=altitude<2200;
  }
  sun.position.set(tp.x + 40, tp.y + 80, tp.z + 30); sun.target.position.copy(tp); sun.target.updateMatrixWorld();
  updateAudio();
  renderer.render(scene, camera);
}

loadPreset('plane');
setMode('build');
requestAnimationFrame(frame);

}
